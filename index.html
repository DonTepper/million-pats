<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help me get 1 Million Pats!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>
      Mihao!
      <span class="sub">1 Pat = 1 Good Luck</span>
      <span class="hint">move across the picture to pat</span>
    </h1>

    <div class="pat-count" id="pat-count">
      I've had <span id="count">0</span> pats
    </div>

    <div class="pet-frame" id="pet-frame">
      <img id="pet" src="images/pet.jpg" alt="Pet me">
      <div class="paw" id="paw" hidden>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <ellipse cx="34" cy="40" rx="16" ry="13" fill="#f6d7c3" stroke="#5c4638" stroke-width="2"/>
          <ellipse cx="18" cy="24" rx="6" ry="8" fill="#f6d7c3" stroke="#5c4638" stroke-width="2"/>
          <ellipse cx="30" cy="16" rx="6" ry="8" fill="#f6d7c3" stroke="#5c4638" stroke-width="2"/>
          <ellipse cx="43" cy="18" rx="6" ry="8" fill="#f6d7c3" stroke="#5c4638" stroke-width="2"/>
          <ellipse cx="52" cy="28" rx="5.5" ry="7" fill="#f6d7c3" stroke="#5c4638" stroke-width="2"/>
        </svg>
      </div>
      <div class="plus" id="plus">+1</div>
    </div>

    <div class="btn-box">
      <div class="love"><div class="love-space">pats are love</div></div>
    </div>

    <p class="address">4CxjZyMNoF1p6eXHXHv1TWpS2X47CuUmLwtGe18spump</p>
  </main>

  <script src="main.js"></script>
</body>
</html>
